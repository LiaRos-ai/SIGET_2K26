# =========================================================
# Sistema de Gestión de Tareas - Configuración común
# =========================================================
#
# Día 14: este archivo ahora solo tiene lo que es IGUAL sin importar el
# entorno (desarrollo o producción). Todo lo que cambia según el entorno
# (conexión a la base de datos, nivel de logging, ddl-auto) se movió a
# application-dev.properties y application-prod.properties.
#
# spring.profiles.active=dev hace que, por defecto (por ejemplo al correr
# "mvn spring-boot:run" en tu máquina), se cargue application-dev.properties
# ADEMÁS de este archivo. En el servidor/contenedor de producción, se
# reemplaza por "prod" con una variable de entorno, sin tocar el código
# ni recompilar nada — ver application-prod.properties y el Dockerfile.

spring.application.name=gestion-tareas
spring.profiles.active=dev

# --- Servidor ---
server.port=8081

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- DevTools ---
spring.devtools.restart.enabled=true

# --- Logging: patrón y archivo (comunes a ambos perfiles) ---
# Spring Boot usa Logback como implementación de SLF4J por defecto — no
# hace falta agregar ninguna dependencia nueva para tener logging real.
logging.file.name=logs/gestion-tareas.log
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
