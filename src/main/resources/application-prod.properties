# =========================================================
# Perfil: PRODUCCIÓN (prod) — Día 14
# =========================================================
# Se activa reemplazando spring.profiles.active=dev por "prod" (o
# "dev,prod") con la variable de entorno SPRING_PROFILES_ACTIVE, SIN
# tocar el código ni recompilar el JAR. Ver el Dockerfile y docker-compose.yml.

# --- Base de datos ---
# NUNCA se hardcodean credenciales acá. ${DB_URL}, ${DB_USERNAME} y
# ${DB_PASSWORD} se completan con variables de entorno del servidor o
# contenedor real — así el mismo JAR sirve para cualquier servidor sin
# reconstruir nada, y las credenciales reales no quedan en el código
# fuente (ni en este repositorio).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ddl-auto=validate: Hibernate compara las entidades @Entity contra las
# tablas reales y FALLA si no coinciden, pero nunca las modifica solo.
# En producción, los cambios de esquema se aplican con una herramienta de
# migración controlada (Flyway/Liquibase — fuera del alcance de este
# curso), nunca dejando que el framework improvise sobre datos reales.
spring.jpa.hibernate.ddl-auto=validate

# En producción no queremos el SQL completo en los logs (ruido + podría
# exponer datos sensibles en el texto de las consultas).
spring.jpa.show-sql=false

# --- Logging más silencioso: solo lo importante ---
logging.level.org.springframework=WARN
logging.level.com.tallerpw=INFO
