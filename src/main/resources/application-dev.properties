# =========================================================
# Perfil: DESARROLLO (dev) — Día 14
# =========================================================
# Se activa por defecto (spring.profiles.active=dev en application.properties).
# Pensado para correr la aplicación en tu propia máquina mientras programás.

# --- Base de datos ---
# Requiere un servidor MySQL corriendo localmente. La base "gestion_tareas"
# se crea sola gracias a "createDatabaseIfNotExist=true" (solo funciona en
# MySQL; en PostgreSQL hay que crear la base a mano antes de arrancar).
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_tareas?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Alternativa PostgreSQL (comentada): descomentar estas 3 líneas, comentar
# las de MySQL de arriba, y cambiar el driver en pom.xml.
#spring.datasource.url=jdbc:postgresql://localhost:5432/gestion_tareas
#spring.datasource.username=postgres
#spring.datasource.password=

# ddl-auto=update: Hibernate crea/actualiza las tablas automáticamente a
# partir de las entidades @Entity. Cómodo para desarrollo: podés cambiar
# una entidad y ver el efecto sin escribir SQL a mano. En producción esto
# NUNCA se usa así (ver application-prod.properties).
spring.jpa.hibernate.ddl-auto=update

# Muestra en la consola el SQL real que genera Hibernate — muy útil para
# entender qué está pasando "debajo" de JpaRepository mientras aprendés.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Logging detallado, para ver qué está pasando mientras programás ---
logging.level.org.springframework=INFO
logging.level.com.tallerpw=DEBUG
