<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="alert alert-primary" style="max-width: 560px;">
            <h1 class="h5">Panel de administración</h1>
            <p class="mb-1">
                Si estás viendo esta página, es porque tu cuenta
                (<span sec:authentication="name">email</span>) tiene el rol
                <strong>ADMIN</strong>.
            </p>
            <p class="small text-muted mb-0">
                Esta ruta está protegida en SecurityConfig con
                .requestMatchers("/admin/**").hasRole("ADMIN"). Todavía no
                tiene funcionalidad real — es solo un ejemplo didáctico de
                autorización por rol (Día 9).
            </p>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
