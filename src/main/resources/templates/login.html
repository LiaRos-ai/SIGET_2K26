<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-5">
                <h1 class="h4 mb-3">Ingresar</h1>

                <!-- ?registrado y ?error son parámetros que agrega Spring Security /
                     nuestro propio redirect, no atributos del Model -->
                <div class="alert alert-success" th:if="${param.registrado != null}">
                    Cuenta creada correctamente. Ya podés iniciar sesión.
                </div>
                <div class="alert alert-danger" th:if="${param.error != null}">
                    Email o contraseña incorrectos.
                </div>

                <!-- Spring Security intercepta este POST automáticamente
                     (formLogin) — no hay un @PostMapping("/login") nuestro. -->
                <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Ingresar</button>
                </form>

                <p class="mt-3 small">
                    ¿No tenés cuenta? <a href="/registro">Registrate acá</a>.
                </p>
                <p class="small text-muted">
                    Demo: admin@tallerpw.com / admin1234 (rol ADMIN) ·
                    estudiante@tallerpw.com / estudiante1234 (rol USER)
                </p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
