<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ocurrió un error</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="alert alert-danger" style="max-width: 560px;">
            <h1 class="h5">Ocurrió un error</h1>
            <p class="mb-0" th:text="${mensaje}">Mensaje genérico</p>
        </div>
        <a href="/" class="btn btn-sm btn-outline-secondary">&larr; Volver al inicio</a>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
