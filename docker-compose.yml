# =========================================================
# docker-compose.yml — Día 14
# =========================================================
# Levanta DOS contenedores juntos: la base de datos MySQL y la
# aplicación, ya conectados entre sí. Uso:
#
#   docker compose up --build
#
# La aplicación queda disponible en http://localhost:8080

services:

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gestion_tareas
      MYSQL_ROOT_PASSWORD: cambiar_esta_clave
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # "prod" activa application-prod.properties (ver esa configuración):
      # las credenciales de abajo llenan los ${DB_URL}/${DB_USERNAME}/${DB_PASSWORD}
      # de ese archivo — nunca están hardcodeadas en application.properties.
      SPRING_PROFILES_ACTIVE: prod
      # "db" es el nombre del servicio de arriba: Docker Compose arma una
      # red interna donde los contenedores se encuentran por ese nombre,
      # en vez de "localhost".
      DB_URL: jdbc:mysql://db:3306/gestion_tareas
      DB_USERNAME: root
      DB_PASSWORD: cambiar_esta_clave
    ports:
      - "8080:8080"

volumes:
  db_data:
